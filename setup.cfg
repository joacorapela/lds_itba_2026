[metadata]
name = ssm_itba_2026
version = 1.0.0
description = Material for state space models lecture at ITBA 2026
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/joacorapela/ssm_itba_2026
author = Joaquin Rapela
author_email = j.rapela@ucl.ac.uk
license = MIT
classifiers = 
    License :: OSI Approved :: MIT License
    Programming Language :: Python :: 3.9

[options]
install_requires = 
    numpy
    scipy
    matplotlib
    plotly
    kaleido
    pandas
    ipynb
    jupyter
    ssm @ git+https://github.com/joacorapela/ssm.git
    sphinx
    sphinx-gallery
    kaleido
    tqdm
    torch
